name: Discord release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)announce, e.g. v1.0.1"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load release for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          rel=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")
          {
            echo "M_TAG=$(jq -r .tag_name <<<"$rel")"
            echo "M_NAME=$(jq -r '.name // ""' <<<"$rel")"
            echo "M_URL=$(jq -r .html_url <<<"$rel")"
            echo "M_PUBLISHED=$(jq -r '.published_at // ""' <<<"$rel")"
            echo "M_PRERELEASE=$(jq -r .prerelease <<<"$rel")"
            echo "M_AUTHOR=$(jq -r '.author.login // ""' <<<"$rel")"
            echo "M_BODY<<__BODY_EOF__"
            jq -r '.body // ""' <<<"$rel"
            echo "__BODY_EOF__"
          } >> "$GITHUB_ENV"

      - name: Post the release embed
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK || secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name || env.M_TAG }}
          RELEASE_NAME: ${{ github.event.release.name || env.M_NAME }}
          RELEASE_BODY: ${{ github.event.release.body || env.M_BODY }}
          RELEASE_URL: ${{ github.event.release.html_url || env.M_URL }}
          REPO: ${{ github.event.repository.full_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          PUBLISHED: ${{ github.event.release.published_at || env.M_PUBLISHED }}
          PRERELEASE: ${{ github.event.release.prerelease || env.M_PRERELEASE }}
          AUTHOR_LOGIN: ${{ github.event.release.author.login || env.M_AUTHOR }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK" ]; then
            echo "No Discord webhook: set DISCORD_RELEASE_WEBHOOK (repo) or DISCORD_WEBHOOK (org) and give this repo access."
            exit 1
          fi
          python3 << 'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          webhook = os.environ["DISCORD_RELEASE_WEBHOOK"]
          tag = (os.environ.get("RELEASE_TAG") or "release").strip()
          name = (os.environ.get("RELEASE_NAME") or "").strip()
          body = os.environ.get("RELEASE_BODY") or ""
          url = (os.environ.get("RELEASE_URL") or "").strip()
          repo = (os.environ.get("REPO") or "").strip()
          repo_name = (os.environ.get("REPO_NAME") or repo or "DonTranQuiL").strip()
          published = (os.environ.get("PUBLISHED") or "").strip()
          prerelease = (os.environ.get("PRERELEASE") or "").lower() == "true"
          author = (os.environ.get("AUTHOR_LOGIN") or "DonTranQuiL").strip() or "DonTranQuiL"
          avatar = f"https://github.com/{author}.png?size=128"
          brand = "https://github.com/DonTranQuiL.png?size=128"

          def clean(text: str) -> str:
              text = re.sub(r"<!--.*?-->", "", text, flags=re.S)
              lines = []
              for line in text.replace("\r\n", "\n").split("\n"):
                  stripped = line.strip()
                  if stripped.lower().startswith("green on this commit"):
                      continue
                  heading = re.match(r"^#{1,6}\s+(.*)$", stripped)
                  if heading:
                      lines.append(f"**{heading.group(1).strip()}**")
                      continue
                  lines.append(line.rstrip())
              notes = re.sub(r"\n{3,}", "\n\n", "\n".join(lines)).strip()
              if len(notes) > 1800:
                  notes = notes[:1800].rsplit(" ", 1)[0].rstrip() + "…"
              return notes

          notes = clean(body) or "The notes are on the release page."
          title = name or f"{repo_name} {tag}"
          if len(title) > 250:
              title = title[:247] + "…"

          embed = {
              "title": title,
              "description": notes,
              "color": 0xC47A14 if prerelease else 0x206444,
              "author": {
                  "name": repo_name,
                  "url": f"https://github.com/{repo}" if repo else "https://github.com/DonTranQuiL",
                  "icon_url": avatar,
              },
              "fields": [
                  {"name": "Version", "value": f"`{tag}`", "inline": True},
                  {
                      "name": "Type",
                      "value": "Pre-release" if prerelease else "Release",
                      "inline": True,
                  },
                  {
                      "name": "GitHub",
                      "value": f"[Open release]({url})" if url else repo or "DonTranQuiL",
                      "inline": True,
                  },
              ],
              "footer": {"text": "DonTranQuiL", "icon_url": brand},
          }
          if url:
              embed["url"] = url
          if published:
              embed["timestamp"] = published

          payload = {
              "username": "DonTranQuiL",
              "avatar_url": brand,
              "content": f"**{repo_name}** `{tag}` is published.",
              "embeds": [embed],
              "allowed_mentions": {"parse": []},
          }
          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DonTranQuiL-release",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
          except urllib.error.HTTPError as err:
              detail = err.read(300).decode("utf-8", "replace")
              raise SystemExit(f"Discord returned {err.code}: {detail[:200]}") from None
          if status >= 300:
              raise SystemExit(f"Discord returned {status}")
          print(f"Posted {repo_name} {tag}")
          PY
